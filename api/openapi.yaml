openapi: 3.1.0
info:
  title: DiwyLearn Public API Contract
  version: 1.0.0
  description: A reduced illustrative contract that omits production routes and schemas.
paths:
  /api/public/courses:
    get:
      summary: List published course summaries
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Published course summaries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CourseSummary' }
  /api/creator/courses:
    post:
      summary: Create a draft course
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCourseRequest' }
      responses:
        '201': { description: Draft course created }
        '400': { description: Invalid title or slug }
        '401': { description: Missing or invalid token }
        '403': { description: Creator or Admin role required }
        '409': { description: Slug already exists }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CourseSummary:
      type: object
      required: [id, title, slug, activeEnrollments]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        slug: { type: string }
        activeEnrollments: { type: integer }
    CreateCourseRequest:
      type: object
      required: [title, slug]
      properties:
        title: { type: string, minLength: 3, maxLength: 160 }
        slug: { type: string, minLength: 3, maxLength: 120 }
